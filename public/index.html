<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Películas y series | Judit & Xavi</title>
  <!-- use-credentials: detrás de Authelia, el manifest necesita la cookie de sesión -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Biblioteca privada</p>
        <h1>Películas y series</h1>
        <p class="subtitle">Buscad en TMDB, guardad pendientes y marcad lo visto con categoría y comentario.</p>
      </div>
      <div class="stats" id="stats">
        <div><strong>0</strong><span>vistas</span></div>
        <div><strong>0</strong><span>pendientes</span></div>
      </div>
    </header>

    <main>
      <section class="panel search-panel">
        <div class="section-title">
          <div>
            <h2>Buscar</h2>
            <p>Películas o series</p>
          </div>
        </div>

        <form id="searchForm" class="search-form">
          <input id="searchInput" type="search" placeholder="Ej: The Last of Us, Interstellar, Dark..." autocomplete="off" />
          <button type="submit">Buscar</button>
        </form>

        <div id="searchMessage" class="message"></div>
        <div id="searchResults" class="grid results-grid"></div>
      </section>

      <section class="panel library-panel">
        <div class="section-title library-title">
          <div>
            <h2>Vuestra lista</h2>
            <p>Todo lo guardado en SQLite</p>
          </div>
          <div class="filters">
            <input id="libraryTextFilter" type="search" placeholder="Filtrar por titulo..." autocomplete="off" aria-label="Filtrar por titulo" />
            <select id="statusFilter" aria-label="Filtrar por estado">
              <option value="all">Todo</option>
              <option value="watchlist">Pendientes</option>
              <option value="watched">Vistas</option>
            </select>
            <select id="verdictFilter" aria-label="Filtrar por categoría">
              <option value="all">Cualquier categoría</option>
              <option value="masterpiece">Obra maestra</option>
              <option value="recommend">La recomendaría</option>
              <option value="meh">Meh</option>
              <option value="crap">Mierdón</option>
              <option value="none">Vistas sin categoría</option>
            </select>
            <select id="mediaTypeFilter" aria-label="Filtrar por tipo">
              <option value="all">Películas y series</option>
              <option value="movie">Solo películas</option>
              <option value="tv">Solo series</option>
            </select>
            <select id="userFilter" aria-label="Filtrar por usuario">
              <option value="">Todos</option>
            </select>
          </div>
        </div>

        <div id="libraryMessage" class="message"></div>
        <div id="library" class="grid library-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="saveDialog" class="dialog">
    <form method="dialog" id="saveForm" class="dialog-card">
      <button type="button" class="icon-button close-button" id="closeDialog" aria-label="Cerrar">×</button>
      <div class="dialog-media">
        <img id="dialogPoster" alt="" />
        <div>
          <p id="dialogType" class="pill"></p>
          <h3 id="dialogTitle"></h3>
          <p id="dialogMeta" class="meta"></p>
          <p id="dialogOverview" class="overview"></p>
        </div>
      </div>

      <div class="form-grid">
        <label>
          Estado
          <select id="saveStatus" required>
            <option value="watchlist">Pendiente</option>
            <option value="watched">Vista</option>
          </select>
        </label>

        <label id="watchedAtLabel">
          Fecha vista
          <input id="saveWatchedAt" type="date" />
        </label>
      </div>

      <fieldset id="verdictField" class="verdict-field">
        <legend>¿Qué os pareció?</legend>
        <div class="verdict-options">
          <label><input type="radio" name="verdict" value="masterpiece" /><span>🏆 Obra maestra</span></label>
          <label><input type="radio" name="verdict" value="recommend" /><span>👍 La recomendaría</span></label>
          <label><input type="radio" name="verdict" value="meh" /><span>😐 Meh</span></label>
          <label><input type="radio" name="verdict" value="crap" /><span>💩 Mierdón</span></label>
          <label><input type="radio" name="verdict" value="" checked /><span>Sin categoría</span></label>
        </div>
      </fieldset>

      <fieldset id="usersField">
        <legend>Guardar para</legend>
        <div id="userCheckboxes" class="checkboxes"></div>
      </fieldset>

      <label id="watchedTogetherLabel" class="checkbox-row">
        <input id="watchedTogether" type="checkbox" />
        Vista juntos
      </label>

      <label>
        Comentario
        <textarea id="saveComment" rows="4" placeholder="Qué os pareció, con quién la viste, si repetirías..."></textarea>
      </label>

      <p id="editHint" class="meta edit-hint"></p>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelSave">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
